name: documentation

on:
  push:
    tags:
      - v*
      - doc*
    branches: [main]
  pull_request:
    branches: [main, "doc/*"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    env:
      DOC_FOLDER: "./docs"

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 🔧
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Setup Pages 📄
        uses: actions/configure-pages@v4

      - name: Restore Dependencies 📦
        working-directory: ${{ env.DOC_FOLDER }}
        run: npm install

      - name: Build Documentation 🔨
        working-directory: ${{ env.DOC_FOLDER }}
        run: npm run build

      - name: Upload artifact 📤
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/build'

  deploy:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/doc') || github.ref == 'refs/heads/main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
